<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sudoku Solver</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <h1>Sudoku Solver</h1>
      <p>Enter a puzzle and let the solver do the work.</p>
    </header>

    <main class="app-card">
      <div id="sudoku-grid" class="sudoku-grid" aria-label="Sudoku board"></div>

      <div class="actions">
        <button id="solve-btn" class="btn primary">Solve</button>
        <button id="hint-btn" class="btn success">Hint</button>
        <button id="clear-btn" class="btn danger">Clear</button>
        <button id="example-btn" class="btn neutral">Example</button>
      </div>

      <p id="message" class="message" aria-live="polite"></p>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
